# The specs added for PS-1781 have nothing running them: this repo has no
# GitHub Actions and its Codacy check reports ACTION_REQUIRED without exposing
# annotations, so every review round so far has had to take "the suite passes"
# on the author's word.
#
# The suite needs no dependencies - it runs on Node's built-in test runner - so
# there is no install step and nothing to keep in step with the lockfile.
name: Tests

# A push to a branch with an open PR would otherwise run this twice - once for
# the push, once for the pull_request - so pushes only cover the long-lived
# branches, and everything else is covered by its PR.
on:
  push:
    branches: [production, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The job reads the code and nothing else
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the test suite
        run: npm test
